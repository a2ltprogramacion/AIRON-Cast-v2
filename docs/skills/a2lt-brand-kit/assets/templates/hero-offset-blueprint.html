<!-- 
  A2LT Premium Hero: Offset Overlap Blueprint (Modelo 3 EXACT MATCH) 
  - Layout matches Justinmind Concept perfectly.
  - Image absolute vertically centered (top-1/2 -translate-y-1/2).
  - Background Split exactly at 60vh / 40vh.
  - Title sits perfectly fixed in the 60vh container.
  - Text & CTA sit perfectly fixed in the 40vh container.
  - Sharp SVG Wave on bottom left.
-->
<section class="relative w-full min-h-[100svh] overflow-hidden bg-slate-900 border-b border-white/5">
    <!-- BACKGROUND SPLIT (Z-0) -->
    <!-- Top 60%: Image + Dark Overlay for Title Legibility -->
    <div class="absolute top-0 left-0 w-full h-[60vh] z-0">
      <img src="https://t4.ftcdn.net/jpg/09/03/40/99/360_F_903409903_Mbx5gG01w7SlX48E6pQY4Ac2mIUeBBUM.jpg" class="w-full h-full object-cover" alt="Background" />
      <div class="absolute inset-0 bg-slate-950/70"></div> <!-- Opacidad controlada -->
    </div>
    
    <!-- Bottom 40%: Solid + Sharp SVG Wave Effect -->
    <div class="absolute bottom-0 left-0 w-full h-[40vh] bg-surface z-0 flex items-end">
      <!-- Wave Vectorial Definida (Sin Blurs locos, solo a la izquierda) -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="#ff5500" fill-opacity="1" d="M0,224L12,234.7C24,245,48,267,72,277.3C96,288,120,288,144,266.7C168,245,192,203,216,165.3C240,128,264,96,288,112C312,128,336,192,360,202.7C384,213,408,171,432,149.3C456,128,480,128,504,160C528,192,552,256,576,277.3C600,299,624,277,648,245.3C672,213,696,171,720,128C744,85,768,43,792,48C816,53,840,107,864,122.7C888,139,912,117,936,138.7C960,160,984,224,1008,245.3C1032,267,1056,245,1080,240C1104,235,1128,245,1152,256C1176,267,1200,277,1224,266.7C1248,256,1272,224,1296,229.3C1320,235,1344,277,1368,282.7C1392,288,1416,256,1428,240L1440,224L1440,320L1428,320C1416,320,1392,320,1368,320C1344,320,1320,320,1296,320C1272,320,1248,320,1224,320C1200,320,1176,320,1152,320C1128,320,1104,320,1080,320C1056,320,1032,320,1008,320C984,320,960,320,936,320C912,320,888,320,864,320C840,320,816,320,792,320C768,320,744,320,720,320C696,320,672,320,648,320C624,320,600,320,576,320C552,320,528,320,504,320C480,320,456,320,432,320C408,320,384,320,360,320C336,320,312,320,288,320C264,320,240,320,216,320C192,320,168,320,144,320C120,320,96,320,72,320C48,320,24,320,12,320L0,320Z"></path></svg>
    </div>
  
    <!-- CONTENT (Z-10) -->
    <!-- Contenedor general en Desktop mantiene la altura de la pantalla para flexionar 60/40 -->
    <div class="container mx-auto px-6 lg:px-12 relative z-10 w-full lg:h-[100svh] flex flex-col lg:flex-row">
      
      <!-- LEFT COLUMN (TEXT & CTA) -->
      <!-- Se divide matemáticamente en 60vh (Arriba) y 40vh (Abajo) en Escritorio -->
      <div class="w-full lg:w-7/12 flex flex-col pt-12 lg:pt-0">
        
        <!-- Title Area -> Atada a la parte superior de la imagen (60vh) -->
        <div class="flex-none lg:h-[60vh] flex flex-col justify-end pb-10">
          <div>
            <span class="inline-block px-3 py-1 mb-6 text-xs font-semibold text-primary bg-primary/20 backdrop-blur-md rounded-full border border-primary/30 tracking-widest uppercase shadow-lg">Modelo 3: Offset HD</span>
            <h1 class="text-5xl md:text-6xl xl:text-[5rem] font-heading font-black text-white leading-[1.05] tracking-tight">
              Estructura <br/>
              <span class="a2lt-shine-dynamic">Editorial Premium</span>
            </h1>
          </div>
        </div>
        
        <!-- Description & CTA Area -> Atada a la parte inferior solida con el Wave (40vh) -->
        <div class="flex-none lg:h-[40vh] flex flex-col justify-start pt-10 pb-20 lg:pb-0 pr-0 lg:pr-10 relative z-10">
          <p class="text-slate-300 text-lg md:text-xl leading-relaxed max-w-xl mb-8 font-medium">
            La imagen izquierda está 100% centrada verticalmente. El texto descansa abajo (Bottom-Left) acompañado de un Vector Wave bien definido, libre de desenfoques de neón. El título flota en la parte opacada.
          </p>
          <div class="flex flex-wrap gap-4">
            <button class="px-8 py-4 bg-primary text-white font-bold rounded-xl hover:bg-primary-dark transition-colors shadow-[0_10px_20px_rgba(255,115,0,0.3)] border border-transparent">
              Comenzar Ahora
            </button>
            <button class="px-8 py-4 bg-surface text-white font-bold rounded-xl border border-white/10 hover:bg-white/5 hover:border-white/30 transition-all flex items-center gap-3 shadow-lg">
              Ver el video <i class="bi bi-play-circle text-xl text-primary"></i>
            </button>
          </div>
        </div>
        
      </div>
  
      <!-- RIGHT COLUMN (OVERLAPPING SECURE CENTER) -->
      <!-- Absolute en LG para un centrado matemático exacto "top-1/2 translateY(-50%)" -->
      <div class="w-full lg:absolute lg:right-6 xl:right-12 lg:w-5/12 lg:top-1/2 lg:-translate-y-1/2 z-20 pb-20 lg:pb-0 flex justify-center lg:justify-end">
        <!-- Altura controlada al 70vh, cabalga sobre el corte -->
        <div class="relative w-full max-w-md xl:max-w-lg h-[60vh] lg:h-[70vh] bg-slate-800 rounded-2xl overflow-hidden shadow-[0_30px_60px_-15px_rgba(0,0,0,0.8)] border border-white/10 hover:-translate-y-2 transition-transform duration-500">
          <img src="https://images.unsplash.com/photo-1600880292203-757bb62b4baf?q=80&w=2070&auto=format&fit=crop" class="w-full h-full object-cover opacity-90" alt="Offset Preview" />
          <div class="absolute inset-0 ring-1 ring-inset ring-white/10 rounded-2xl"></div>
        </div>
      </div>
  
    </div>
  </section>
